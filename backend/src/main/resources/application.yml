spring:
  application:
    name: transport-platform-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/transport_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:transport}
    password: ${DB_PASSWORD:transport}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[jdbc.time_zone]": UTC
        "[format_sql]": false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  bootstrap:
    platform-admin:
      enabled: false
      email: ${APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:platform-admin@transport-platform.local}
      password: ${APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:}
  security:
    api-docs-enabled: false
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    jwt:
      issuer: transport-platform
      secret: ${APP_SECURITY_JWT_SECRET:}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  multi-tenant:
    header-name: X-Tenant-Id

logging:
  level:
    root: INFO
    "[com.transportplatform.tms]": INFO
