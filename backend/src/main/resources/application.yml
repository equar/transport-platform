spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: transport-platform-backend
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3311}/transport_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${MYSQL_USER:root}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQL_PASSWORD:root}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        "[jdbc.time_zone]": UTC
        "[format_sql]": false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8087
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    password-reset-base-url: ${APP_AUTH_PASSWORD_RESET_BASE_URL:http://localhost:3007/reset-password}
    password-reset-ttl: PT2H
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    provider: ${APP_EMAIL_PROVIDER:logging}
    from: ${APP_EMAIL_FROM:}
  push:
    enabled: ${APP_PUSH_ENABLED:false}
    provider: ${APP_PUSH_PROVIDER:logging}
    expo:
      url: ${APP_PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  microsoft:
    graph:
      client-id: ${MICROSOFT_GRAPH_CLIENT_ID:}
      tenant-id: ${MICROSOFT_GRAPH_TENANT_ID:}
      client-secret: ${MICROSOFT_GRAPH_CLIENT_SECRET:}
      scopes: ${MICROSOFT_GRAPH_SCOPES:https://graph.microsoft.com/.default}
  bootstrap:
    platform-admin:
      enabled: ${APP_BOOTSTRAP_PLATFORM_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:samuelweld2019@gmail.com}
      password: ${APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:Password123}
  security:
    api-docs-enabled: false
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:}
    auth-rate-limit:
      enabled: true
      window: PT1M
      login-max-requests: 10
      refresh-max-requests: 30
      forgot-password-max-requests: 5
    jwt:
      issuer: transport-platform
      secret: ${APP_SECURITY_JWT_SECRET:}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  multi-tenant:
    header-name: X-Tenant-Id

logging:
  level:
    root: INFO
    "[com.transportplatform.tms]": INFO
