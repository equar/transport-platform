spring:
  application:
    name: transport-platform-backend
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:transport_platform}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${MYSQL_USER:transport}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQL_PASSWORD:transport}}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        "[jdbc.time_zone]": UTC
        "[format_sql]": false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  bootstrap:
    platform-admin:
      enabled: false
      email: ${APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:platform-admin@transport-platform.local}
      password: ${APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:}
  security:
    api-docs-enabled: false
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:}
    jwt:
      issuer: transport-platform
      secret: ${APP_SECURITY_JWT_SECRET:}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  multi-tenant:
    header-name: X-Tenant-Id

logging:
  level:
    root: INFO
    "[com.transportplatform.tms]": INFO
