spring:
  config:
    # Load root-level local overrides when running from backend/.
    import: optional:file:../.env.local[.properties]
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    locations: classpath:db/migration,classpath:db/devdata

app:
  bootstrap:
    platform-admin:
      enabled: true
      email: ${APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:}
  security:
    api-docs-enabled: true
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:3007,http://127.0.0.1:3007}
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:}

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
