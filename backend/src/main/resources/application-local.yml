spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  bootstrap:
    platform-admin:
      enabled: true
      email: ${APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:platform-admin@transport-platform.local}
      password: ${APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:ChangeMe123!}
  security:
    api-docs-enabled: true
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:local-development-jwt-secret-change-before-shared-use-1234567890}

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
