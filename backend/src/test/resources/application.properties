# Disposable fixture compatibility; privacy test keys are installed by the test-only environment postprocessor.
app.privacy.allow-legacy-reads=true

# Workers are exercised explicitly; do not query stopped Testcontainers through cached Spring contexts.
app.scheduling.enabled=false

# HTTP fixtures must never write into the developer runtime document directory.
app.driver-document-storage.root=./target/test-driver-documents/${random.uuid}
