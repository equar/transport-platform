services:
  mysql:
    image: mysql:8.4
    container_name: transport-platform-mysql
    environment:
      MYSQL_DATABASE: transport_platform
      MYSQL_USER: transport
      MYSQL_PASSWORD: transport
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transport-platform-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/transport_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: transport
      DB_PASSWORD: transport
      APP_SECURITY_JWT_SECRET: change-me-please-change-me-please-change-me-1234
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: transport-platform-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql-data:
