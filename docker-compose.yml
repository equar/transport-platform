services:
  mysql:
    image: mysql:8.4
    container_name: transport-platform-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-transport_platform}
      MYSQL_USER: ${MYSQL_USER:-transport}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-transport}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transport-platform-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-transport_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-transport}
      DB_PASSWORD: ${MYSQL_PASSWORD:-transport}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-local-development-jwt-secret-change-before-shared-use-1234567890}
      APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL: ${APP_BOOTSTRAP_PLATFORM_ADMIN_EMAIL:-platform-admin@transport-platform.local}
      APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD: ${APP_BOOTSTRAP_PLATFORM_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: transport-platform-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
