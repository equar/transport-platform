name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test API contract synchronization guard
        run: node --test ../scripts/check-api-contracts.test.mjs
      - name: Build backend
        run: mvn -B verify
      - name: Scan production Java dependencies
        run: |
          mvn -B dependency:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
          python3 ../scripts/check-maven-vulnerabilities.py target/dependency-tree.json target/security-report.json
      - name: Verify generated client contracts
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/generate-api-types.mjs backend/target/api-contracts.json
          git diff --exit-code -- frontend/src/shared/api/generated mobile/src/api/generated

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Run web tests
        run: npm test
      - name: Type check and build
        run: |
          npm run typecheck
          npm run build

      - name: Retain private source maps
        uses: actions/upload-artifact@v4
        with:
          name: web-source-maps-${{ github.sha }}
          path: frontend/artifacts/source-maps
          retention-days: 30

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test plugins/withOptionalAndroidHardware.test.cjs
      - run: npm run security:patch-check
      - run: npm audit --audit-level=high
      - run: npm run test:ci
