name: Validate deployment

on:
  pull_request:
    paths:
      - deployment/**
      - .github/workflows/deploy.yml
      - .github/workflows/validate-deployment.yml
      - backend/src/main/resources/application-prod.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proxy validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx openssl
      - name: Test configuration, selection, failure recovery and proxy syntax
        run: python3 -m unittest discover -s deployment/aws/tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q deployment/aws
